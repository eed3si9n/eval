name: Build Status

on:
  pull_request:
    branches: [develop]
  push:
    branches: []

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            java: 17
            distribution: temurin
          - os: ubuntu-latest
            java: 21
            distribution: temurin
          - os: macos-latest
            java: 17
            distribution: temurin
          - os: windows-latest
            java: 17
            distribution: zulu
    runs-on: ${{ matrix.os }}
    env:
      JAVA_OPTS: -Dsbt.io.virtual=false -Dfile.encoding=UTF-8
      JVM_OPTS: -Dsbt.io.virtual=false -Dfile.encoding=UTF-8
    steps:
    - uses: actions/checkout@v7
    - uses: eed3si9n/scruff@v0.3.3
      with:
        format: true
        lint: true
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: "${{ matrix.distribution }}"
        java-version: "${{ matrix.java }}"
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - name: Run tests
      shell: bash
      run: sbt -v +test
